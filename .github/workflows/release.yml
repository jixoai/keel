name: Release

# Publishes one self-contained `keel` binary per platform for a `v*` tag. Each
# binary embeds its platform's PostgreSQL 18 runtime, the packaged web client
# and the README; `keel start` needs no external database and no environment.
#
# The PostgreSQL runtime comes from the relocatable zonky/theseus Maven
# artifacts (PostgreSQL licence), extracted at build time and embedded xz-tar.
# Nothing is built on a laptop: a tag (or manual dispatch) is the only trigger.
#
# Assets land on this repository's Release page. `jixoai/fde2e-releases` (the
# aggregate outlet) needs FDE2E_RELEASES_TOKEN; when present the same bytes are
# mirrored under `keel-v<ver>`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: version gate (tag ↔ keel version)
        id: ver
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          BUILT="$(go run ./cmd/keel version | sed -n 's/^keel //p' | head -1)"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::tag v$VERSION ≠ reported version '$BUILT' — bump the version constant before tagging"
            exit 1
          fi
          echo "✓ tag v$VERSION matches the binary's reported version"

      - name: build the web client
        id: web
        # A failed web build fails the release: v0.2.0 shipped without its zip
        # because this step was continue-on-error.
        run: |
          set -euo pipefail
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.6.1 sh -s --
          export PATH="$HOME/.nsh/bin:$PATH"
          nsh --version
          ./scripts/package-web.sh "$RUNNER_TEMP/webdist"
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.version }}"
          (cd "$RUNNER_TEMP/webdist" && zip -q -r "$GITHUB_WORKSPACE/dist/keel-web-$VERSION.zip" .)
          ls -la dist

      - name: build self-contained binaries
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          WEB="$RUNNER_TEMP/webdist"
          PG_VERSION="18.7.0"
          mkdir -p dist build
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            case "$GOOS/$GOARCH" in
              darwin/arm64) pgart="darwin-arm64v8" ;;
              darwin/amd64) pgart="darwin-amd64" ;;
              linux/amd64) pgart="linux-amd64" ;;
              linux/arm64) pgart="linux-arm64v8" ;;
              windows/amd64) pgart="windows-amd64" ;;
            esac
            OUT="keel"; [ "$GOOS" = "windows" ] && OUT="keel.exe"
            DIR="build/$GOOS-$GOARCH"
            mkdir -p "$DIR"

            echo "→ $GOOS/$GOARCH (PostgreSQL $pgart $PG_VERSION)"
            JAR_URL="https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-${pgart}/${PG_VERSION}/embedded-postgres-binaries-${pgart}-${PG_VERSION}.jar"
            curl -fsSL --retry 3 -o /tmp/pg.jar "$JAR_URL"
            unzip -p /tmp/pg.jar '*.txz' > cmd/keel/assets/pg.txz
            rm -rf cmd/keel/assets/web
            mkdir -p cmd/keel/assets/web
            cp -R "$WEB/Keel/." cmd/keel/assets/web/
            cp web/icon.png cmd/keel/assets/icon.png
            cp README.md cmd/keel/assets/README.md

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$DIR/$OUT" ./cmd/keel
            cp README.md "$DIR/README.md"
            if [ "$GOOS" = "windows" ]; then
              (cd "$DIR" && zip -q -r "../../dist/keel-$VERSION-$GOOS-$GOARCH.zip" .)
            else
              tar -C "$DIR" -czf "dist/keel-$VERSION-$GOOS-$GOARCH.tar.gz" .
            fi
            ls -lh "$DIR/$OUT"
          done
          # The next checkout/build starts from the placeholder again.
          rm -rf cmd/keel/assets/pg.txz cmd/keel/assets/web cmd/keel/assets/icon.png cmd/keel/assets/README.md
          ls -la dist

      - name: checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          for f in $(ls | grep -v '^SHA256SUMS.txt$' | sort); do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: publish (this repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="keel ${{ steps.ver.outputs.version }} — ${{ github.event.repository.name }} build ${GITHUB_SHA::7}

          One binary per platform: PostgreSQL 18 and the web client are embedded.
          macOS:  chmod +x keel && ./keel install   (generates ~/Applications/Keel.app, ad-hoc signed, no notarization)
          Others: chmod +x keel && ./keel start     (no database, no KEEL_DSN, no Docker)
          Update: chmod +x keel && ./keel update     (SHA-256 verified; no signing required)

          Nothing is code-signed as a binary; macOS may quarantine the download. The
          installed .app is ad-hoc signed locally. SHA256SUMS.txt has every asset."
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "keel ${{ steps.ver.outputs.version }}" --notes "$NOTES" --verify-tag || \
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: mirror to the aggregate outlet (when the token is configured)
        env:
          AGG_TOKEN: ${{ secrets.FDE2E_RELEASES_TOKEN }}
        run: |
          if [ -z "${AGG_TOKEN:-}" ]; then
            echo "no FDE2E_RELEASES_TOKEN configured — skipping the aggregate mirror"
            exit 0
          fi
          export GH_TOKEN="$AGG_TOKEN"
          TAG="keel-${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" dist/* --repo jixoai/fde2e-releases \
            --title "keel ${{ steps.ver.outputs.version }}" \
            --notes "keel ${{ steps.ver.outputs.version }} — mirrored from ${{ github.repository }}" || \
          gh release upload "$TAG" dist/* --repo jixoai/fde2e-releases --clobber
