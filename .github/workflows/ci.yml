name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly 10-minute SIGKILL chaos (see the chaos-nightly job). It is the
    # only scheduled job in this workflow; ordinary pushes never pay for it.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      # Full history: the binary size gate builds the base commit's tree, and a
      # depth-1 checkout does not contain that commit (scripts/binary-size.sh).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        env:
          KEEL_TEST_DSN: postgres://postgres:runtime@127.0.0.1:5432/runtime?sslmode=disable
        # Every integration package opens the same PostgreSQL service. Several
        # suites exercise schema migrations and legacy-table refusal, so package
        # binaries must not open it concurrently; `-p 1` is the supported
        # integration mode (tests within a package still run normally).
        run: go test -race -p 1 ./...
      - name: go build
        run: go build ./...
      # The VmRSS gate is shell/Python, not covered by `go test`: run its
      # parser/sum/threshold fixtures (synthetic /proc and ps tables, no
      # processes, no network). A broken gate must not reach a delivery.
      - name: VmRSS sampler fixtures
        run: bash scripts/acceptance-rss.sh --self-test
      # Owner constraint (2026-11-23): the Go binary must not balloon. The gate
      # builds both shipping commands (cmd/keel, cmd/runtime) at the base revision
      # and the change (stripped, CGO off) and fails when a target grows past the
      # budget; a PDF/image/video parser or any other new dependency must be
      # measured here before it can land.
      - name: binary size gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="HEAD~1" ;;
          esac
          # Phase 1 imports keel-board v0.1.1 plus the tenant sync/secrets
          # wiring: together they add ~3.0 MiB to cmd/keel, a deliberate core
          # capability rather than dependency drift. The Phase 1 hardening
          # review measured only 132 KiB of headroom under the old 3 MiB
          # ceiling, so keel's budget is 4 MiB: still a gate against unbounded
          # growth (board is ~3.0 MiB), with room for the Phase 2 UI contract
          # work. cmd/runtime adds no dependency and is unchanged; the script
          # applies the same ceiling to both shipping commands.
          ./scripts/binary-size.sh --base "$base" --budget-kb 4096
      # The catalog is the only machine-readable coverage truth; COVERAGE.md
      # §A/§B/§C are mapped onto it and §H is generated. A stale catalog or an
      # ungenerated §H fails here (docs/PLUGIN-CATALOG.md).
      - name: plugin catalog
        run: node scripts/plugin-catalog.mjs --check

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        run: docker build -t keel:ci .

  chaos-nightly:
    # The 10-minute random-SIGKILL soak: cmd/chaos restarts the runtime every
    # 30s while clients keep posting input, then asserts the ledger invariants
    # (contiguous seq, one user.message per requestId, at most one final reply
    # per turn, no stuck run). Scheduled or manually dispatched; it is far too
    # slow for every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      # The acceptance wrapper drives the fault loop and its strict ledger
      # audit; it expects a dedicated container named keel-pg (KEEL_PG_CTR).
      - name: start dedicated postgres
        run: |
          docker run -d --name keel-pg \
            -e POSTGRES_PASSWORD=runtime -e POSTGRES_USER=postgres -e POSTGRES_DB=runtime \
            -p 5432:5432 postgres:18
          for i in $(seq 1 60); do
            if docker exec keel-pg pg_isready -U postgres -d runtime >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          docker logs keel-pg >&2 || true
          exit 1
      - name: nightly chaos (600s, SIGKILL every 30s)
        env:
          KEEL_TEST_DSN: postgres://postgres:runtime@127.0.0.1:5432/runtime?sslmode=disable
          KEEL_PG_CTR: keel-pg
        run: scripts/acceptance-g5-chaos.sh evidence/chaos
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-evidence
          path: evidence/chaos
          if-no-files-found: warn
