name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly chaos placeholder: the job structure is wired, the scenario is
    # still a TODO (see the chaos-nightly job).
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      # Full history: the binary size gate builds the base commit's tree, and a
      # depth-1 checkout does not contain that commit (scripts/binary-size.sh).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        env:
          KEEL_TEST_DSN: postgres://postgres:runtime@127.0.0.1:5432/runtime?sslmode=disable
        # Every integration package opens the same PostgreSQL service. Several
        # suites exercise schema migrations and legacy-table refusal, so package
        # binaries must not open it concurrently; `-p 1` is the supported
        # integration mode (tests within a package still run normally).
        run: go test -race -p 1 ./...
      - name: go build
        run: go build ./...
      # The VmRSS gate is shell/Python, not covered by `go test`: run its
      # parser/sum/threshold fixtures (synthetic /proc and ps tables, no
      # processes, no network). A broken gate must not reach a delivery.
      - name: VmRSS sampler fixtures
        run: bash scripts/acceptance-rss.sh --self-test
      # Owner constraint (2026-11-23): the Go binary must not balloon. The gate
      # builds both shipping commands (cmd/keel, cmd/runtime) at the base revision
      # and the change (stripped, CGO off) and fails when a target grows past the
      # budget; a PDF/image/video parser or any other new dependency must be
      # measured here before it can land.
      - name: binary size gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="HEAD~1" ;;
          esac
          # Phase 1 imports keel-board v0.1.0: the board log/HTTP/sync/audit
          # surface adds ~1.3 MiB to cmd/keel (3.6% of the binary), a deliberate
          # core capability rather than dependency drift. The 2 MiB ceiling is
          # still a gate against further unbounded growth; cmd/runtime is
          # unchanged. Commands previously raised this from 200 to 256 KiB.
          ./scripts/binary-size.sh --base "$base" --budget-kb 2048
      # The catalog is the only machine-readable coverage truth; COVERAGE.md
      # §A/§B/§C are mapped onto it and §H is generated. A stale catalog or an
      # ungenerated §H fails here (docs/PLUGIN-CATALOG.md).
      - name: plugin catalog
        run: node scripts/plugin-catalog.mjs --check

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        run: docker build -t keel:ci .

  chaos-nightly:
    # Placeholder only: scheduled runs execute a no-op until the random-kill
    # matrix (cmd/e2e, 10 minutes, kill -9 every 30s) is wired.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nightly chaos (TODO)
        run: |
          echo "TODO: run cmd/e2e random-kill matrix for 10 minutes"
          go build ./...
