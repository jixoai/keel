id: keel.creation
version: 1.0.0
kind: in-process
description: "Creation mode: the agent scaffolds, validates, installs and removes real plugin packages. The harness-owned `creation` tool owns the model-facing name; this plugin supplies the action backend and the plugin standard prompt section."
engines:
  keel: ">=0.1.0 <1.0.0"
provides: {}
permissions:
  tools:
    - keel.creation.catalog
    - keel.creation.scaffold
    - keel.creation.read
    - keel.creation.write
    - keel.creation.validate
    - keel.creation.install
    - keel.creation.list
    - keel.creation.remove
source:
  type: builtin
