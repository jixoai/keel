id: keel.approval
version: 1.0.0
kind: in-process
description: "Approval primitive: confirm/prompt/choice questions with durable decisions, human-in-the-loop waiting, persisted timeout/cancel, and validated provenance (who answered, over which channel, and whether the answer was a declared option or the 'other' escape). The harness-owned `approve` tool owns the model-facing name; this plugin supplies the action backend."
engines:
  keel: ">=0.1.0 <1.0.0"
provides: {}
permissions:
  tools:
    - keel.approval.confirm
    - keel.approval.prompt
    - keel.approval.choice
source:
  type: builtin
