id: keel.model
version: 1.0.0
kind: in-process
description: "Model registry plugin: reads the configured providers and their models (families, session surfaces, selectability) through the same resolved projection the settings page serves, and edits the tenant models document's provider entries through its one write path."
engines:
  keel: ">=0.1.0 <1.0.0"
provides:
  cli:
    - path: [model, providers]
      summary: "List every configured provider with its family, executable state and model count."
      description: "Reads GET /v1/providers — the resolved settings projection. It shows no credential material; a provider whose credential this process cannot resolve stays visible with its issue, so an operator can read why it is unavailable. It does not edit configuration: the settings page is the document's only writer."
      args_schema:
        type: object
        properties:
          json:
            type: boolean
            description: "print the raw response instead of a table"
      output_schema:
        type: object
        properties:
          providers:
            type: array
            items:
              type: object
              properties:
                providerId: { type: string }
                name: { type: string }
                providerType: { type: string }
                executable: { type: boolean }
                selectable: { type: boolean }
          issues:
            type: array
        required: [providers]
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model providers", "keel model providers --json"]
    - path: [model, provider, list]
      summary: "List every configured provider with its family, executable state and model count."
      description: "Reads GET /v1/providers — the resolved settings projection. It shows no credential material; a provider whose credential this process cannot resolve stays visible with its issue, so an operator can read why it is unavailable. --type filters the printed rows only; it does not resolve or validate a provider family (the family vocabulary is plugin-declared and open). It does not edit configuration: the settings page and the provider write subset are the document's only writers."
      args_schema:
        type: object
        properties:
          type:
            type: string
            description: "only providers of this family (presentation filter; plugin-declared, open vocabulary)"
          json:
            type: boolean
            description: "print the raw response instead of a table"
      output_schema:
        type: object
        properties:
          providers:
            type: array
            items:
              type: object
              properties:
                providerId: { type: string }
                name: { type: string }
                providerType: { type: string }
                executable: { type: boolean }
                selectable: { type: boolean }
          issues:
            type: array
        required: [providers]
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model provider list", "keel model provider list --type image"]
    - path: [model, provider, show]
      summary: "Show one configured provider's full resolved view as JSON."
      description: "Reads GET /v1/providers and prints the named provider's resolved view: identity, family, session surface, visibility, API type/base URL, credential references (env name or secret reference only — never a value), its models and issues, and the executable/selectable flags. A hidden or unknown provider is a miss, never an empty success. Referencing agents/teams are surfaced by the remove refusal (the deletion-protection path), not invented here."
      args_schema:
        type: object
        properties:
          id:
            type: string
            description: "provider id"
        required: [id]
      output_schema:
        type: object
        properties:
          providerId: { type: string }
          name: { type: string }
          providerType: { type: string }
          surfaceKind: { type: string }
          visibility: { type: string }
          api: { type: object }
          access: { type: object }
          models: { type: array }
          issues: { type: array }
          executable: { type: boolean }
          selectable: { type: boolean }
        required: [providerId]
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model provider show s2api", "keel model provider show magpie --json"]
    - path: [model, list]
      summary: "List the flat model registry: provider/model, family, session surface, selectability."
      description: "Reads GET /v1/models — the executable registry projection. It includes complete, enabled models that are not session-selectable (a decision model carries selectable=false) so the whole capability surface is visible. It does not filter by what a picker would offer; that filter is the client's."
      args_schema:
        type: object
        properties:
          json:
            type: boolean
            description: "print the raw response instead of a table"
      output_schema:
        type: object
        properties:
          models:
            type: array
            items:
              type: object
              properties:
                providerId: { type: string }
                modelId: { type: string }
                providerType: { type: string }
                surfaceKind: { type: string }
                selectable: { type: boolean }
          issues:
            type: array
        required: [models]
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model list", "keel model list --json"]
    - path: [model, show]
      summary: "Show one model by \"provider/model\" (a bare model id must be unique)."
      description: "Prints the model's full resolved view as JSON: family, surface, API type, properties, option specs, selectability and its issues. An ambiguous bare id names the candidate providers instead of guessing."
      args_schema:
        type: object
        properties:
          id:
            type: string
            description: "\"providerId/modelId\", or a bare modelId that exactly one provider carries"
        required: [id]
      output_schema:
        type: object
        properties:
          providerId: { type: string }
          modelId: { type: string }
          providerType: { type: string }
          surfaceKind: { type: string }
          options: { type: object }
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model show s2api/deepseek-v4.1-flash"]
    - path: [model, provider, add]
      summary: "Declare a provider entry in the tenant models document."
      description: "Declares one provider entry (id, name, family, api.type/baseUrl/headers, access.env or access.ref, modelIds, visibility) in the tenant models document and writes it with the revision guard (PUT /v1/settings/models). Credentials are references only (an env var name or a secret reference); the command neither accepts nor prints a value. The server's validation is the only authority on the resulting configuration: a rejected write prints its field-level issues and nothing is stored."
      args_schema:
        type: object
        properties:
          id:
            type: string
            description: "provider id (the entry's identity)"
          name: { type: string }
          type:
            type: string
            description: "provider family (llm, image, tts, ...; plugin-declared, open vocabulary)"
          api_type:
            type: string
            description: "wire API (openai-chat-completions, openai-responses, anthropic-messages)"
          base_url: { type: string }
          env:
            type: string
            description: "credential env var NAME (a reference, never a value)"
          ref: { type: string }
          model: { type: array, items: { type: string } }
          header: { type: array, items: { type: string } }
          visibility: { type: string }
          json: { type: boolean }
        required: [id]
      output_schema:
        type: object
        properties:
          revision: { type: integer }
          providersExecutable: { type: integer }
          modelsSelectable: { type: integer }
        required: [revision]
      permissions: [model.write]
      danger: write
      idempotent: false
      callable_by: [ui, agent]
      examples: ["keel model provider add magpie --type llm --base-url https://magpie.example.test/v1 --env MAGPIE_API_KEY --model m1"]
    - path: [model, provider, update]
      summary: "Edit one provider entry (or start a patch of a catalog provider)."
      description: "Read-modify-write of the tenant models document: only the flags passed are applied to the named entry, and everything else — including the fields this CLI does not edit — is sent back verbatim under the revision it was read at. A provider the document does not declare yet (a built-in catalog entry) gets a patch entry of the same id, the documented incremental-adoption path. The same values repeated produce the same document, so a retry is safe."
      args_schema:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          type: { type: string }
          api_type: { type: string }
          base_url: { type: string }
          env: { type: string }
          ref: { type: string }
          model: { type: array, items: { type: string } }
          header: { type: array, items: { type: string } }
          visibility: { type: string }
          json: { type: boolean }
        required: [id]
      output_schema:
        type: object
        properties:
          revision: { type: integer }
          providersExecutable: { type: integer }
          modelsSelectable: { type: integer }
        required: [revision]
      permissions: [model.write]
      danger: write
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model provider update magpie --visibility hidden", "keel model provider update s2api --model deepseek-v4.1-flash"]
    - path: [model, provider, remove]
      summary: "Drop one provider entry the document declares (reference protected)."
      description: "Removes one providers[] entry the tenant models document declares and writes the document with the revision guard. A provider an agent or a team still binds is refused with 409 provider_in_use and the referring registry rows (id/name/field), so a binding is never silently orphaned: repoint those bindings, or disable the provider instead. When the document's own default selection names the provider, --repoint-selection must name its replacement (the command never guesses one). The built-in catalog's own providers cannot be removed this way and the command says so; the entry's values simply stop applying when it is gone. Destructive, so only the human face may call it."
      args_schema:
        type: object
        properties:
          id: { type: string }
          repoint_selection:
            type: string
            description: "\"providerId/modelId\" the document's default selection moves to; required when the selection names the removed provider"
          json: { type: boolean }
        required: [id]
      output_schema:
        type: object
        properties:
          removed: { type: string }
          revision: { type: integer }
          stillServedByCatalog: { type: boolean }
        required: [removed]
      permissions: [model.write]
      danger: destructive
      idempotent: false
      callable_by: [ui]
      examples: ["keel model provider remove magpie"]
    - path: [model, provider, test]
      summary: "Probe one provider with one real minimal upstream request."
      description: "Asks the server to send one minimal model-list request (GET /models, or /v1/models for Anthropic) with the provider's resolved credential and reports the measured health: ready (authenticated and answered), needs_auth (no credential could be resolved — nothing was sent), unreachable (a request was sent and failed), or invalid_config (the provider is incomplete on paper — nothing was sent). The credential is resolved on the server and never appears in the output; a probe that did not reach the provider never reports success. The in-process demo protocol answers without a network request. Safe to repeat: no configuration is written."
      args_schema:
        type: object
        properties:
          id: { type: string }
          json: { type: boolean }
        required: [id]
      output_schema:
        type: object
        properties:
          providerId: { type: string }
          providerType: { type: string }
          apiType: { type: string }
          endpoint: { type: string }
          ok: { type: boolean }
          status:
            type: string
            enum: [ready, needs_auth, unreachable, invalid_config]
          latencyMs: { type: integer }
          modelCount: { type: integer }
          models: { type: array, items: { type: string } }
          error: { type: string }
          issues: { type: array }
        required: [providerId, ok, status]
      permissions: [model.read]
      danger: write
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model provider test s2api", "keel model provider test magpie --json"]
    - path: [model, catalog]
      summary: "Read one provider's model catalog (live upstream list with --refresh)."
      description: "Reads GET /v1/providers and prints the named provider's resolved model catalog — every model with its family, session surface, enabled/executable/selectable state and issues — or, with no provider id, every visible provider's models. --refresh asks the server to re-fetch the provider's live lineup with one minimal upstream request (the same probe `model provider test` uses) and prints those ids instead of the resolved view; it needs a provider id and never writes configuration. Credentials never appear: the CLI only sees the server-resolved projection or the discovered ids."
      args_schema:
        type: object
        properties:
          provider_id:
            type: string
            description: "provider id; omit to read every visible provider's resolved catalog"
          refresh:
            type: boolean
            description: "re-fetch the provider's live model list (requires a provider id)"
          json: { type: boolean }
      output_schema:
        type: object
        properties:
          providerId: { type: string }
          source:
            type: string
            enum: [resolved, upstream]
          models: { type: array }
          issues: { type: array }
      permissions: [model.read]
      danger: read
      idempotent: true
      callable_by: [ui, agent]
      examples: ["keel model catalog s2api", "keel model catalog s2api --refresh --json"]
source:
  type: builtin
