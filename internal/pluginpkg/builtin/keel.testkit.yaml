id: keel.testkit
version: 1.0.0
kind: in-process
description: Test-only tools (clock, echo). Disabled by default; enable it only in tests and E2E, then grant the tools to the agent that should see them.
engines:
  keel: ">=0.1.0 <1.0.0"
provides:
  tools:
    - clock
    - echo
permissions:
  tools:
    - clock
    - echo
source:
  type: builtin
