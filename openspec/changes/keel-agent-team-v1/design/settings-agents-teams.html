<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel Harness · 设置 · Agents 与团队</title>
<style>
:root {
  --bg: #0A0A0B;
  --surface: #101012;
  --surface-2: #141418;
  --surface-3: #0C0C0E;
  --raised: #191920;
  --raised-2: #232329;
  --badge-bg: #202020;
  --line: #232329;
  --line-strong: #34343C;
  --line-control: #62626C;
  --ink-1: #EDE9E1;
  --ink-2: #B4AFA5;
  --ink-3: #8C887F;
  --accent: #F5F1E8;
  --accent-ink: #101012;
  --accent-soft: rgba(245,241,232,.08);
  --accent-line: rgba(245,241,232,.24);
  --danger: #F08C7C;
  --danger-ink: #1A0F0D;
  --warn: #E6B76A;
  --ok: #8ED3AC;
  --font-sans: "Avenir Next", "Avenir", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 48px; --sp-10: 64px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --dur-1: 160ms; --dur-2: 220ms;
  --ease-out: cubic-bezier(.2,.8,.2,1);
  --shadow-card: 0 2px 8px rgba(0,0,0,.25);
  --shadow-dialog: 0 32px 80px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.35);
  --shadow-menu: 0 16px 40px rgba(0,0,0,.5);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden]:not([hidden="until-found" i]) { display: none !important; }
dialog:not([open]) { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
::selection { background: rgba(245,241,232,.22); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.od-icon { display: inline-block; width: var(--od-icon-size, 1em); height: var(--od-icon-size, 1em); flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: 60px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-5);
  padding: 0 var(--sp-7);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand__mark {
  display: grid; place-items: center; width: 24px; height: 24px; flex: none;
  border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink-2);
}
.brand__name { font-size: 12px; font-weight: 600; letter-spacing: .18em; white-space: nowrap; }
.brand__rule { width: 1px; height: 16px; background: var(--line-strong); flex: none; }
.brand__doc { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.crumb strong { color: var(--ink-2); font-weight: 500; }
.topbar__suffix { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-3); white-space: nowrap; }

.shell { width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 32px 64px; }

.tabs {
  display: flex; align-items: stretch; gap: var(--sp-6);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--sp-4);
}
.tab {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 2px;
  border: 0; background: transparent;
  color: var(--ink-3); font-size: 15px; font-weight: 600; letter-spacing: .01em;
  transition: color var(--dur-1) var(--ease-out);
}
.tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: transparent; border-radius: 2px 2px 0 0;
  transition: background var(--dur-1) var(--ease-out);
}
.tab:hover { color: var(--ink-1); }
.tab.is-active { color: var(--ink-1); }
.tab.is-active::after { background: var(--accent); }
.tab__count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px;
  border: 1px solid var(--line); border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.tab.is-active .tab__count { color: var(--ink-2); border-color: var(--line-strong); }

.review {
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  padding: 0 0 14px; margin-bottom: var(--sp-6);
  border-bottom: 1px solid var(--line);
}
.review__label { font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--ink-3); flex: none; }
.review__chips { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; min-width: 0; }
.rev-chip {
  height: 30px; padding: 0 var(--sp-3);
  display: inline-flex; align-items: center;
  border: 1px solid var(--line); border-radius: var(--r-pill);
  background: transparent; color: var(--ink-2);
  font-size: 12px; font-weight: 500; letter-spacing: .02em;
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.rev-chip:hover { color: var(--ink-1); border-color: var(--line-strong); }
.rev-chip.is-active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.review__hint { margin-left: auto; max-width: 560px; font-size: 12px; line-height: 1.55; color: var(--ink-3); text-align: right; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-5); margin-bottom: var(--sp-5); }
.eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.page-head h1 { margin-top: 6px; font-size: 26px; line-height: 1.35; font-weight: 600; letter-spacing: 0; }
.page-lead { margin-top: 6px; max-width: 56ch; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.page-head__side { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-2); flex: none; }
.page-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 0 14px;
  border: 1px solid transparent; border-radius: 8px;
  font-size: 13px; font-weight: 500; letter-spacing: .02em; line-height: 1;
  transition: background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}
.btn--primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn--primary:hover { background: #FFFDF6; }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn--ghost:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--ink-1); }
.btn--danger { background: var(--danger); color: var(--danger-ink); font-weight: 600; }
.btn--danger:hover { background: #F6A192; }
.btn:disabled { background: var(--surface-2); border-color: var(--line); color: var(--ink-3); cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink-3); }
.btn--primary:disabled, .btn--danger:disabled { background: var(--surface-2); border-color: var(--line); color: var(--ink-3); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none;
  border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink-3);
  transition: color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.icon-btn:hover { color: var(--ink-1); background: var(--surface-2); border-color: var(--line); }
.icon-btn:disabled { color: var(--ink-3); cursor: not-allowed; background: transparent; border-color: transparent; }

.agent-grid, .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.agent-card, .team-card {
  display: grid; gap: var(--sp-3);
  min-width: 0; min-height: 172px; padding: var(--sp-4);
  background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md);
  transition: border-color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out);
}
.agent-card { grid-template-rows: auto minmax(0, 1fr) auto; }
.team-card { grid-template-rows: auto minmax(0, 1fr) auto auto; }
.agent-card:hover, .team-card:hover { border-color: var(--line-strong); background: #111114; }
.agent__head, .team__head { display: flex; align-items: flex-start; gap: var(--sp-3); min-width: 0; }
.agent__id, .team__id { flex: 1 1 auto; min-width: 0; }
.agent__name-row, .team__name-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; min-width: 0; }
.agent__name, .team__name { font-size: 15px; line-height: 1.4; font-weight: 600; color: var(--ink-1); overflow-wrap: anywhere; }
.agent-card.is-archived .agent__name { color: var(--ink-2); }
.card-desc { margin-top: 4px; font-size: 12px; line-height: 1.65; color: var(--ink-2); overflow-wrap: anywhere; }
.agent-card.is-archived .card-desc { color: var(--ink-3); }
.card-actions { display: flex; align-items: center; gap: 2px; flex: none; margin: -4px -6px 0 0; }
.card-action {
  min-height: 30px; padding: 0 7px;
  border: 1px solid transparent; border-radius: 6px; background: transparent;
  color: var(--ink-3); font-size: 12px; font-weight: 500;
  transition: color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.card-action:hover { color: var(--ink-1); background: var(--surface-2); border-color: var(--line); }
.card-action--danger:hover { color: var(--danger); background: rgba(240,140,124,.08); border-color: rgba(240,140,124,.2); }

.avatar {
  position: relative; display: block; flex: none;
  width: var(--av, 40px); height: var(--av, 40px);
  border: 1px solid var(--line-strong); border-radius: 9px;
  background: var(--badge-bg); color: #D8D1C3; overflow: hidden;
}
.avatar svg { display: block; width: 100%; height: 100%; }
.avatar__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.agent-card.is-archived .avatar { color: var(--ink-3); }
.emblem {
  display: grid; place-items: center; flex: none;
  width: 40px; height: 40px;
  border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--badge-bg); color: #C9C1B2;
}
.emblem svg { display: block; width: 30px; height: 30px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  height: 24px; padding: 0 8px;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  background: var(--badge-bg);
  font-size: 11px; font-weight: 500; letter-spacing: .02em; white-space: nowrap;
}
.badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge--ok { color: var(--ok); border-color: rgba(142,211,172,.38); }
.badge--warn { color: var(--warn); border-color: rgba(230,183,106,.38); }
.badge--danger { color: var(--danger); border-color: rgba(240,140,124,.38); }

.facts { display: flex; flex-wrap: wrap; gap: 6px; align-self: end; }
.fact {
  display: inline-flex; align-items: center; gap: 5px;
  max-width: 100%; height: 26px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: var(--r-pill);
  background: var(--badge-bg); color: var(--ink-3);
  font-size: 11px; line-height: 1; white-space: nowrap; overflow: hidden;
}
.fact .od-icon { color: var(--ink-3); }
.fact__label { flex: none; }
.fact__value { min-width: 0; color: var(--ink-1); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }

.captain-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 12px; line-height: 1.5; color: var(--ink-3);
}
.captain-row .od-icon { color: var(--ink-3); }
.captain-row strong { color: var(--ink-1); font-weight: 600; }
.team__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; }
.member-count { flex: none; font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.roster { display: flex; align-items: center; min-width: 0; padding-left: 6px; }
.roster__avatar { width: 22px; height: 22px; margin-left: -6px; border-radius: 6px; border-width: 1px; box-shadow: 0 0 0 2px var(--surface); }
.roster__avatar.is-captain { border-color: rgba(142,211,172,.7); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px rgba(142,211,172,.35); }
.roster__more {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 22px; height: 22px; margin-left: -6px; padding: 0 5px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--badge-bg); color: var(--ink-2);
  font-family: var(--font-mono); font-size: 9px; font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--surface);
}

.empty-card {
  display: grid; justify-items: center; gap: var(--sp-3);
  padding: 40px var(--sp-6);
  background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  text-align: center;
}
.empty-card__icon {
  display: grid; place-items: center; width: 44px; height: 44px;
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--badge-bg); color: var(--ink-2);
}
.empty-card h3 { font-size: 16px; line-height: 1.45; font-weight: 600; }
.empty-card p { max-width: 46ch; font-size: 13px; line-height: 1.75; color: var(--ink-2); }
.empty-card__note { font-size: 11.5px; line-height: 1.7; color: var(--ink-3); }
.empty-card .btn { margin-top: var(--sp-1); }

.sk { background: #191920; border-radius: 4px; animation: sk-pulse 1.5s var(--ease-out) infinite; }
.sk-card {
  min-height: 172px; padding: var(--sp-4);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  display: grid; gap: 12px; align-content: start;
}
.sk-row { display: flex; gap: 10px; align-items: center; }
.sk-block { flex: 1; display: grid; gap: 8px; min-width: 0; }
.sk-facts { display: flex; gap: 6px; margin-top: auto; }
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .52; } }

dialog.editor {
  width: 640px; max-width: calc(100vw - 32px);
  max-height: min(820px, calc(100vh - 48px));
  margin: auto; padding: 0;
  border: 1px solid var(--line-strong); border-radius: var(--r-lg);
  background: #121214; color: var(--ink-1);
  box-shadow: var(--shadow-dialog);
  overflow: hidden;
}
dialog.editor[data-kind="team"] { width: 560px; }
dialog.editor::backdrop { background: rgba(0,0,0,.62); }
dialog.editor[open] { animation: dialog-in var(--dur-2) var(--ease-out) both; }
@keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.995); } to { opacity: 1; transform: none; } }
.editor__surface { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: inherit; }
.editor__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) var(--sp-3); }
.editor__head h2 { font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: 0; }
.editor__title-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.editor__sub { margin-top: 4px; max-width: 46ch; font-size: 11px; line-height: 1.65; color: var(--ink-3); }
.editor__head .icon-btn { margin-top: -4px; margin-right: -6px; }
.editor__body { display: grid; gap: var(--sp-5); padding: 0 var(--sp-5) var(--sp-5); overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.form-section { display: grid; gap: var(--sp-3); }
.form-section + .form-section { padding-top: var(--sp-4); border-top: 1px solid var(--line); }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--ink-3); }
.field { display: grid; gap: 6px; min-width: 0; }
.field__label { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }
.req { font-size: 10px; font-weight: 400; letter-spacing: .04em; color: var(--ink-3); }
.field__hint { font-size: 11px; line-height: 1.65; color: var(--ink-3); overflow-wrap: anywhere; }
.field__hint--warn { color: var(--warn); }
.control {
  width: 100%; height: 40px; padding: 0 12px;
  background: var(--surface-3); color: var(--ink-1);
  border: 1px solid var(--line-control); border-radius: 8px;
  font-size: 14px; line-height: 1.4;
  transition: border-color var(--dur-1) var(--ease-out), outline-color var(--dur-1) var(--ease-out);
}
.control::placeholder { color: var(--ink-3); opacity: 1; }
.control:hover { border-color: var(--ink-3); }
.control:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--line-control); }
.control[aria-invalid="true"] { border-color: var(--danger); }
select.control { appearance: none; padding-right: 36px; cursor: pointer; }
.select-wrap { position: relative; }
.select-wrap__icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.control:disabled { background: #0F0F12; color: var(--ink-3); border-color: var(--line); cursor: not-allowed; }
textarea.control { height: auto; min-height: 72px; padding: 9px 12px; line-height: 1.6; resize: vertical; }
.field-error { display: flex; align-items: flex-start; gap: 5px; font-size: 11px; line-height: 1.55; color: var(--danger); }
.field-error .od-icon { margin-top: 2px; }
.avatar-field-row { display: flex; align-items: center; gap: var(--sp-3); }
.avatar-field-row .field { flex: 1; }
.avatar-preview { flex: none; }

.combo { display: grid; gap: 6px; min-width: 0; }
.combo__field {
  position: relative; display: flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 5px 38px 5px 8px;
  background: var(--surface-3);
  border: 1px solid var(--line-control); border-radius: 8px;
  cursor: pointer;
}
.combo__field:hover { border-color: var(--ink-3); }
.combo__field.is-open { border-color: var(--accent-line); }
.combo__chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; flex: 1; }
.combo__placeholder { padding-left: 4px; font-size: 13px; color: var(--ink-3); }
.combo__chip {
  display: inline-flex; align-items: center; gap: 2px;
  height: 26px; padding: 0 2px 0 9px;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  background: var(--badge-bg); color: var(--ink-1); font-size: 11px; line-height: 1;
}
.combo__chip-remove {
  display: grid; place-items: center; width: 22px; height: 22px;
  border: 0; border-radius: 50%; background: transparent; color: var(--ink-3);
}
.combo__chip-remove:hover { color: var(--danger); background: rgba(240,140,124,.1); }
.combo__toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: grid; place-items: center; width: 30px; height: 30px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink-3);
}
.combo__toggle:hover { color: var(--ink-1); background: var(--surface-2); }
.combo__toggle .od-icon { transition: transform var(--dur-1) var(--ease-out); }
.combo__toggle[aria-expanded="true"] .od-icon { transform: rotate(180deg); }
.combo__menu {
  display: grid; gap: 1px; margin-top: 2px; padding: 5px;
  background: #121214; border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: var(--shadow-menu);
}
.combo__item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; min-height: 36px; padding: 5px 8px;
  border: 0; border-radius: 6px; background: transparent;
  color: var(--ink-2); font-size: 12px; text-align: left;
}
.combo__item:hover { background: var(--surface-2); color: var(--ink-1); }
.combo__item.is-selected { color: var(--ink-1); }
.combo__item:disabled { color: var(--ink-3); cursor: default; background: transparent; }
.combo__check { display: grid; place-items: center; width: 14px; height: 14px; flex: none; color: var(--accent); }

        '<div class="agent__head">' +
          avatarHTML(a.name || a.id, a.name, a.avatar, 40, "") +
          '<div class="agent__id">' +
            '<div class="agent__name-row"><h3 class="agent__name" id="agent-title-' + esc(a.id) + '">' + esc(a.name) + "</h3>" + archived + "</div>" +
            '<p class="card-desc">' + esc(a.desc || "还没有描述。") + "</p>" +
          "</div>" +
          '<div class="card-actions">' +
            '<button type="button" class="card-action" data-edit-agent="' + esc(a.id) + '">编辑</button>' +
            '<button type="button" class="card-action card-action--danger" data-delete-agent="' + esc(a.id) + '" aria-label="删除 Agent ' + esc(a.name) + '">删除</button>' +
          "</div>" +
        "</div>" +
        '<div class="facts">' +
          '<span class="fact">' + icon("star", 12) + '<span class="fact__label">默认模型</span><span class="fact__value">' + esc(value) + "</span></span>" +
          '<span class="fact">' + icon("tool", 12) + '<span class="fact__label">工具</span><span class="fact__value">' + a.tools.length + "</span></span>" +
        "</div>" +
      "</article>";
    }).join("");
  }

  function rosterHTML(team) {
    var roster = [team.captainId].concat(team.memberIds).filter(Boolean);
    var shown = roster.slice(0, 8);
    var extra = roster.length - shown.length;
    var bodies = shown.map(function (id) {
      var agent = agentById(id);
      if (!agent) return "";
      return avatarHTML(agent.name || agent.id, agent.name, agent.avatar, 22, "roster__avatar" + (id === team.captainId ? " is-captain" : ""));
    }).join("");
    return '<div class="roster" aria-label="团队成员">' + bodies +
      (extra > 0 ? '<span class="roster__more" title="还有 ' + extra + ' 位成员">+' + extra + "</span>" : "") +
      "</div>";
  }

  function currentTeamsHTML() {
    return state.teams.map(function (t) {
      var captain = agentById(t.captainId);
      return '<article class="team-card" aria-labelledby="team-title-' + esc(t.id) + '">' +
        '<div class="team__head">' +
          '<span class="emblem" aria-hidden="true">' + emblemSVG(t.name || t.id) + "</span>" +
          '<div class="team__id">' +
            '<div class="team__name-row"><h3 class="team__name" id="team-title-' + esc(t.id) + '">' + esc(t.name) + "</h3></div>" +
            '<p class="card-desc">' + esc(t.desc || "还没有描述。") + "</p>" +
          "</div>" +
          '<div class="card-actions">' +
            '<button type="button" class="card-action" data-edit-team="' + esc(t.id) + '">编辑</button>' +
            '<button type="button" class="card-action card-action--danger" data-delete-team="' + esc(t.id) + '" aria-label="删除团队 ' + esc(t.name) + '">删除</button>' +
          "</div>" +
        "</div>" +
        '<div class="captain-row">' + icon("crown", 12) +
          "<span>队长：" + (captain ? "<strong>" + esc(captain.name) + "</strong>" : "<strong>未指定</strong>") + "</span>" +
          (captain ? '<span class="badge badge--ok"><span class="badge__dot" aria-hidden="true"></span>队长</span>' : "") +
        "</div>" +
        '<div class="team__foot">' +
          '<span class="member-count">成员 ' + t.memberIds.length + " 人</span>" +
          rosterHTML(t) +
        "</div>" +
      "</article>";
    }).join("");
  }

  function loadingHTML(tab) {
    var cards = "";
    var count = tab === "agents" ? 4 : 2;
    for (var i = 0; i < count; i += 1) {
      cards += '<div class="sk-card" aria-hidden="true">' +
        '<div class="sk-row"><span class="sk" style="width:40px;height:40px;border-radius:9px"></span>' +
        '<span class="sk-block"><span class="sk" style="width:34%;height:11px"></span><span class="sk" style="width:82%;height:9px"></span></span></div>' +
        '<span class="sk" style="width:76%;height:9px"></span>' +
        '<div class="sk-facts"><span class="sk" style="width:132px;height:26px;border-radius:13px"></span><span class="sk" style="width:72px;height:26px;border-radius:13px"></span></div>' +
      "</div>";
    }
    return '<div class="' + (tab === "agents" ? "agent-grid" : "team-grid") + '" aria-busy="true">' + cards + "</div>";
  }

  function emptyHTML(tab) {
    if (tab === "agents") {
      return '<div class="empty-card">' +
        '<span class="empty-card__icon" aria-hidden="true">' + icon("users", 22) + "</span>" +
        "<h3>还没有 Agent，创建一个</h3>" +
        "<p>只填名字就能创建；默认模型与工具可以之后再加。团队至少要有一位队长，所以先建 Agent。</p>" +
        '<button type="button" class="btn btn--primary" data-action="new-agent">' + icon("plus", 14) + "新建 Agent</button>" +
      "</div>";
    }
    return '<div class="empty-card">' +
      '<span class="empty-card__icon" aria-hidden="true">' + icon("shield", 22) + "</span>" +
      "<h3>还没有团队</h3>" +
      "<p>团队必须先有一位队长。先创建 Agent，再把合适的成员编进团队。</p>" +
      '<p class="empty-card__note">需要先有 Agent；团队至少要有一位队长。</p>' +
      '<button type="button" class="btn btn--primary" data-action="new-team">' + icon("plus", 14) + "新建团队</button>" +
    "</div>";
  }

  function renderTabs() {
    $$("#sectionTabs [data-tab]").forEach(function (tab) {
      var on = tab.dataset.tab === state.tab;
      tab.classList.toggle("is-active", on);
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.setAttribute("tabindex", on ? "0" : "-1");
    });
    $("#tabCountAgents").textContent = String(state.agents.length);
    $("#tabCountTeams").textContent = String(state.teams.length);
    $("#pagePanel").setAttribute("aria-labelledby", "tab-" + state.tab);
  }

  function renderReview() {
    var tab = state.tab;
    var current = state.review[tab];
    $("#reviewChips").innerHTML = REVIEW_STATES.map(function (s) {
      var on = s.id === current;
      return '<button type="button" class="rev-chip' + (on ? " is-active" : "") + '" data-review="' + s.id +
        '" aria-pressed="' + (on ? "true" : "false") + '">' + s.label + "</button>";
    }).join("");
    $("#reviewHint").textContent = REVIEW_HINTS[tab][current] || "";
  }

  function renderHead() {
    var tab = state.tab;
    var review = state.review[tab];
    var isAgents = tab === "agents";
    $("#pageEyebrow").textContent = isAgents ? "设置 · 03 · Agents" : "设置 · 04 · 团队";
    $("#pageTitle").textContent = isAgents ? "Agents" : "团队";
    $("#pageLead").textContent = isAgents
      ? "每个 Agent 是一位可被团队引用的成员。默认模型与工具决定它在会话里的能力边界。"
      : "团队由一位队长和若干成员组成。队长决定最终结论，成员提供各自的专长。";
    var meta;
    if (review === "loading") meta = "读取中…";
    else if (review === "empty") meta = isAgents ? "0 位 Agent" : "0 个团队";
    else if (isAgents) {
      var archived = state.agents.filter(function (a) { return a.archived; }).length;
      meta = state.agents.length + " 位 Agent" + (archived ? " · " + archived + " 已归档" : "");
    } else {
      meta = state.teams.length + " 个团队 · " + state.agents.length + " 位 Agent";
    }
    $("#pageMeta").textContent = meta;

    var action = $("#pageAction");
    action.dataset.action = isAgents ? "new-agent" : "new-team";
    action.innerHTML = icon("plus", 14) + (isAgents ? "新建 Agent" : "新建团队");
    action.disabled = review === "loading" || (!isAgents && !activeAgents().length);
  }

  function renderBody() {
    var tab = state.tab;
    var review = state.review[tab];
    var body = $("#pageBody");
    if (review === "loading") body.innerHTML = loadingHTML(tab);
    else if (review === "empty") body.innerHTML = emptyHTML(tab);
    else body.innerHTML = '<div class="' + (tab === "agents" ? "agent-grid" : "team-grid") + '">' +
      (tab === "agents" ? currentAgentsHTML() : currentTeamsHTML()) + "</div>";
  }

  function renderAll() {
    renderTabs();
    renderReview();
    renderHead();
    renderBody();
  }

  function focusReviewChip(id) {
    var chip = $('#reviewChips [data-review="' + id + '"]');
    if (chip) chip.focus();
  }

  function discardDialog() {
    if (!state.dialog.open) return;
    clearTimeout(state.saveTimer);
    state.dialog.open = false;
    state.dialog.saving = false;
    state.dialog.preview = null;
    state.dialog.toolsOpen = false;
    state.dialog.membersOpen = false;
    state.dialog.draft = null;
    state.dialog.focusTarget = "";
    if (entityDialog.open) entityDialog.close();
  }

  function switchTab(tab) {
    if (tab === state.tab) return;
    if (state.dialog.open) {
      var oldTab = state.tab;
      state.review[oldTab] = baseReview(oldTab);
      discardDialog();
    }
    state.tab = tab;
    renderAll();
    var btn = $('#sectionTabs [data-tab="' + tab + '"]');
    if (btn) btn.focus();
  }

  function setReview(kind) {
    var tab = state.tab;
    if (state.dialog.open) {
      state.review[tab] = baseReview(tab);
      discardDialog();
    }
    state.review[tab] = kind;
    if (kind === "saving" || kind === "failed") {
      var entity = tab === "agents" ? state.agents[0] : state.teams[0];
      openEditor(tab === "agents" ? "agent" : "team", entity ? entity.id : null, { preview: kind });
      return;
    }
    renderAll();
    focusReviewChip(kind);
  }

  function agentDraft(agent) {
    return agent ? {
      name: agent.name,
      desc: agent.desc,
      model: agent.model,
      tools: agent.tools.slice(),
      prompt: agent.prompt,
      avatar: agent.avatar
    } : { name: "", desc: "", model: "", tools: [], prompt: "", avatar: "" };
  }

  function teamDraft(team) {
    return team ? {
      name: team.name,
      desc: team.desc,
      captainId: team.captainId,
      memberIds: team.memberIds.slice()
    } : { name: "", desc: "", captainId: "", memberIds: [] };
  }

  function openEditor(kind, id, options) {
    options = options || {};
    var preview = options.preview || null;
    var entity = kind === "agent" ? (id ? agentById(id) : null) : (id ? teamById(id) : null);
    var draft = kind === "agent" ? agentDraft(entity) : teamDraft(entity);
    var errors = {};
    var errorSummary = "";
    var saveError = "";

    if (preview === "failed") {
      if (kind === "agent") {
        var conflict = state.agents.filter(function (a) { return !entity || a.id !== entity.id; })[0];
        draft.name = conflict ? conflict.name : "林一";
        errors.name = "已有同名 Agent，请换一个名称。";
        errorSummary = "保存失败：名称已被占用";
        saveError = "本次修改已保留。换一个名字后重试即可。";
      } else {
        var teamConflict = state.teams.filter(function (t) { return !entity || t.id !== entity.id; })[0];
        draft.name = teamConflict ? teamConflict.name : "评审小组";
        errors.name = "已有同名团队，请换一个名称。";
        errorSummary = "保存失败：团队名已被占用";
        saveError = "本次修改已保留。换一个团队名后重试即可。";
      }
    }

    state.dialog = {
      open: true,
      kind: kind,
      mode: entity ? "edit" : "new",
      id: entity ? entity.id : null,
      draft: draft,
      errors: errors,
      errorSummary: errorSummary,
      saveError: saveError,
      saving: preview === "saving",
      preview: preview,
      toolsOpen: false,
      membersOpen: false,
      returnFocus: options.returnFocus || (entity
        ? (kind === "agent" ? '[data-edit-agent="' + entity.id + '"]' : '[data-edit-team="' + entity.id + '"]')
        : (kind === "agent" ? '[data-action="new-agent"]' : '[data-action="new-team"]')),
      focusTarget: preview === "saving" ? "" : "name",
      dirty: false
    };

    if (preview) state.review[state.tab] = preview;
    entityDialog.dataset.kind = kind;
    renderReview();
    renderEditor();
    if (!entityDialog.open) entityDialog.showModal();
    applyEditorFocus();
    if (preview === "saving") {
      clearTimeout(state.saveTimer);
      state.saveTimer = window.setTimeout(commitSave, 1400);
    }
  }

  function editorTitle() {
    var d = state.dialog;
    if (d.kind === "agent") return d.mode === "new" ? "新建 Agent" : "编辑 Agent";
    return d.mode === "new" ? "新建团队" : "编辑团队";
  }

  function editorSub() {
    var d = state.dialog;
    if (d.preview === "saving") return "正在保存，请稍候。";
    if (d.preview === "failed") return "保存未完成；本次修改已保留。";
    if (d.kind === "agent") {
      return d.mode === "new" ? "只填名字就能创建；默认模型与工具可以之后再补。" : "只修改这位 Agent；它所在的团队引用不受影响。";
    }
    return d.mode === "new" ? "先选队长，再挑成员；队长自动计入团队。" : "更换队长会把新队长移出成员列表；旧队长回到可选成员。";
  }

  function errorHTML(field) {
    if (!state.dialog.errors[field]) return "";
    return '<p class="field-error" id="error-' + field + '">' + icon("alert", 12) + "<span>" + esc(state.dialog.errors[field]) + "</span></p>";
  }

  function comboField(d, kind) {
    var open = kind === "tools" ? d.toolsOpen : d.membersOpen;
    var toggleAction = kind === "tools" ? "toggle-tools" : "toggle-members";
    var selected;
    var chips;
    var menu;
    if (kind === "tools") {
      selected = d.draft.tools;
      chips = selected.map(function (id) {
        return '<span class="combo__chip">' + esc(toolLabel(id)) +
          '<button type="button" class="combo__chip-remove" data-remove-tool="' + esc(id) + '" aria-label="移除 ' + esc(toolLabel(id)) + '">' + icon("close", 10) + "</button></span>";
      }).join("");
      menu = TOOLS.map(function (tool) {
        var on = selected.indexOf(tool.id) !== -1;
        return '<button type="button" class="combo__item' + (on ? " is-selected" : "") + '" role="option" aria-selected="' + (on ? "true" : "false") + '" data-tool="' + esc(tool.id) + '"' + (d.saving ? " disabled" : "") + ">" +
          '<span class="combo__check">' + (on ? icon("check", 12) : "") + "</span><span>" + esc(tool.label) + "</span></button>";
      }).join("");
    } else {
      selected = d.draft.memberIds;
      chips = selected.map(function (id) {
        var agent = agentById(id);
        if (!agent) return "";
        return '<span class="combo__chip">' + esc(agent.name) +
          '<button type="button" class="combo__chip-remove" data-remove-member="' + esc(id) + '" aria-label="移除 ' + esc(agent.name) + '">' + icon("close", 10) + "</button></span>";
      }).join("");
      var captain = agentById(d.draft.captainId);
      if (captain && captain.archived) captain = null;
      var captainItem = captain
        ? '<button type="button" class="combo__item is-selected" role="option" aria-selected="true" disabled>' +
            '<span class="combo__check">' + icon("check", 12) + "</span><span>" + esc(captain.name) + '</span><span class="combo__note">（队长，不可移除）</span></button>'
        : "";
      menu = captainItem + activeAgents().filter(function (agent) {
        return agent.id !== d.draft.captainId;
      }).map(function (agent) {
        var on = selected.indexOf(agent.id) !== -1;
        return '<button type="button" class="combo__item' + (on ? " is-selected" : "") + '" role="option" aria-selected="' + (on ? "true" : "false") + '" data-member="' + esc(agent.id) + '"' + (d.saving ? " disabled" : "") + ">" +
          '<span class="combo__check">' + (on ? icon("check", 12) : "") + "</span><span>" + esc(agent.name) + "</span></button>";
      }).join("");
      if (!captainItem && !menu) menu = '<p class="combo__empty">还没有可加入的 Agent。</p>';
    }
    return '<div class="combo" data-combo="' + kind + '">' +
      '<div class="combo__field' + (open ? " is-open" : "") + '" data-combo-field="' + kind + '">' +
        '<div class="combo__chips">' + (chips || '<span class="combo__placeholder">' + (kind === "tools" ? "选择工具（可留空）" : "选择成员（可留空）") + "</span>") + "</div>" +
        '<button type="button" class="combo__toggle" data-action="' + toggleAction + '" aria-haspopup="listbox" aria-expanded="' + (open ? "true" : "false") + '" aria-label="' + (kind === "tools" ? "选择工具" : "选择成员") + '"' + (d.saving ? " disabled" : "") + ">" + icon("chevron", 14) + "</button>" +
      "</div>" +
      (open ? '<div class="combo__menu" role="listbox" aria-multiselectable="true" aria-label="' + (kind === "tools" ? "工具" : "成员") + '">' + menu + "</div>" : "") +
    "</div>";
  }

  function renderEditor() {
    var d = state.dialog;
    if (!d.draft) return;
    var draft = d.draft;
    var isAgent = d.kind === "agent";
    var saving = d.saving;
    var disabled = saving ? " disabled" : "";
    var captainAgent = draft.captainId ? agentById(draft.captainId) : null;
    var hasCaptain = !!(captainAgent && !captainAgent.archived);
    var saveDisabled = saving || (!isAgent && !hasCaptain);
    var scrollHost = entityDialog.querySelector(".editor__body");
    var scrollTop = scrollHost ? scrollHost.scrollTop : 0;

    var errorSummary = "";
    if (d.errorSummary) {
      errorSummary = '<div class="alert" role="alert">' + icon("alert", 16) +
        "<div><strong>" + esc(d.errorSummary) + "</strong>" + (d.saveError ? "<p>" + esc(d.saveError) + "</p>" : "") + "</div></div>";
    }
    var savingNote = d.preview === "saving"
      ? '<div class="saving-note" role="status"><span class="spinner" aria-hidden="true"></span>正在保存，通常不超过 1 秒。</div>'
      : "";
    var failedBadge = d.preview === "failed" ? '<span class="badge badge--danger"><span class="badge__dot" aria-hidden="true"></span>保存失败</span>' : "";

    var body;
    if (isAgent) {
      body = '<section class="form-section" aria-labelledby="identityLabel">' +
          '<h3 class="section-label" id="identityLabel">身份</h3>' +
          '<div class="field"><label class="field__label" for="fieldName">名字<span class="req">必填</span></label>' +
            '<input class="control" id="fieldName" data-field="name" type="text" value="' + esc(draft.name) + '" placeholder="例如 许澄" maxlength="24" spellcheck="false" autocomplete="off"' +
              (d.errors.name ? ' aria-invalid="true" aria-describedby="error-name"' : "") + disabled + ">" +
            errorHTML("name") +
          "</div>" +
          '<div class="field"><label class="field__label" for="fieldDesc">描述</label>' +
            '<textarea class="control" id="fieldDesc" data-field="desc" rows="2" maxlength="120" placeholder="一句话说明它擅长什么。"' + disabled + ">" + esc(draft.desc) + "</textarea>" +
          "</div>" +
          '<div class="avatar-field-row">' +
            '<span class="avatar-preview" data-avatar-preview>' + avatarHTML(draft.name || "agent", draft.name, draft.avatar.trim(), 32, "") + "</span>" +
            '<div class="field"><label class="field__label" for="fieldAvatar">头像 URL</label>' +
              '<input class="control" id="fieldAvatar" data-field="avatar" type="url" inputmode="url" value="' + esc(draft.avatar) + '" placeholder="https://…/avatar.png" spellcheck="false" autocomplete="off"' +
                (d.errors.avatar ? ' aria-invalid="true" aria-describedby="error-avatar"' : "") + disabled + ">" +
              '<p class="field__hint">留空则使用 identicon；图片加载失败也会回退到 identicon。</p>' + errorHTML("avatar") +
            "</div>" +
          "</div>" +
        "</section>" +
        '<section class="form-section" aria-labelledby="abilityLabel">' +
          '<h3 class="section-label" id="abilityLabel">能力</h3>' +
          '<div class="field"><label class="field__label" for="fieldModel">默认模型</label>' +
            '<div class="select-wrap"><select class="control" id="fieldModel" data-field="model"' + disabled + ">" + modelOptions(draft.model) + "</select>" +
            '<span class="select-wrap__icon" aria-hidden="true">' + icon("chevron", 14) + "</span></div>" +
            '<p class="field__hint">只列出已配置 Provider 的模型；「跟随部署默认」会随设置页的默认模型变化。</p>' +
          "</div>" +
          '<div class="field"><span class="field__label">工具</span>' + comboField(d, "tools") +
            '<p class="field__hint">工具可留空；之后可以在 Agent 编辑里补充。</p>' +
          "</div>" +
          '<div class="field"><label class="field__label" for="fieldPrompt">系统提示词</label>' +
            '<textarea class="control" id="fieldPrompt" data-field="prompt" rows="4" placeholder="直接写 inline，或填写 AGENTS.md 路径，例如 AGENTS.md#review。"' + disabled + ">" + esc(draft.prompt) + "</textarea>" +
            '<p class="field__hint">可直接写 inline，或填写 AGENTS.md 路径，例如 AGENTS.md#review。</p>' +
          "</div>" +
        "</section>";
    } else {
      var captainOptions = '<option value=""' + (!hasCaptain ? " selected" : "") + ">选择队长</option>" +
        activeAgents().map(function (agent) {
          return '<option value="' + esc(agent.id) + '"' + (agent.id === draft.captainId ? " selected" : "") + ">" + esc(agent.name) + "</option>";
        }).join("");
      body = '<section class="form-section" aria-labelledby="teamBaseLabel">' +
          '<h3 class="section-label" id="teamBaseLabel">基本信息</h3>' +
          '<div class="field"><label class="field__label" for="fieldName">团队名<span class="req">必填</span></label>' +
            '<input class="control" id="fieldName" data-field="name" type="text" value="' + esc(draft.name) + '" placeholder="例如 评审小组" maxlength="24" spellcheck="false" autocomplete="off"' +
              (d.errors.name ? ' aria-invalid="true" aria-describedby="error-name"' : "") + disabled + ">" +
            errorHTML("name") +
          "</div>" +
          '<div class="field"><label class="field__label" for="fieldDesc">描述</label>' +
            '<textarea class="control" id="fieldDesc" data-field="desc" rows="2" maxlength="120" placeholder="这个团队负责什么。"' + disabled + ">" + esc(draft.desc) + "</textarea>" +
          "</div>" +
        "</section>" +
        '<section class="form-section" aria-labelledby="teamMemberLabel">' +

  function trapTab(event, root) {
    if (event.key !== "Tab") return false;
    var nodes = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])', root)
      .filter(function (el) { return el.offsetWidth || el.offsetHeight || el.getClientRects().length; });
    if (!nodes.length) return false;
    var first = nodes[0];
    var last = nodes[nodes.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
      return true;
    }
    if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
      return true;
    }
    return false;
  }

  confirmDialog.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeConfirm();
      return;
    }
    trapTab(event, confirmDialog);
  });

  confirmDialog.addEventListener("cancel", function (event) {
    event.preventDefault();
    closeConfirm();
  });

  confirmDialog.addEventListener("close", function () {
    if (state.confirm) {
      state.confirm = null;
      var target = $("#pageAction") || $("#pageTitle");
      if (target) target.focus();
    }
  });

  $("#sectionTabs").addEventListener("keydown", function (event) {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    var tabs = $$("#sectionTabs [data-tab]");
    var index = tabs.indexOf(document.activeElement);
    if (index === -1) index = state.tab === "agents" ? 0 : 1;
    var next = event.key === "ArrowRight" ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
    event.preventDefault();
    tabs[next].focus();
    switchTab(tabs[next].dataset.tab);
  });

  window.addEventListener("resize", function () {
    if (state.dialog.toolsOpen || state.dialog.membersOpen) {
      state.dialog.toolsOpen = false;
      state.dialog.membersOpen = false;
      renderEditor();
    }
  });

  $(".toast__icon").innerHTML = icon("check", 14);
  renderAll();
})();
</script>
</body>
</html>
