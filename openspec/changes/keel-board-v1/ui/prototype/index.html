/* ==========================================================================
   Base
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--link);text-decoration:none}
h1,h2,h3,h4,p{margin:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
svg{display:block}
::selection{background:var(--selected)}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
*::-webkit-scrollbar-track{background:transparent}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:14px;height:14px}.icon.xs{width:12px;height:12px}.icon.lg{width:18px;height:18px}.icon.xl{width:20px;height:20px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid color-mix(in srgb,var(--foreground) 65%,transparent);outline-offset:0}

/* ==========================================================================
   Solid Glass materials (mirrors web/src/ui/kit/components/styles.tsx)
   ========================================================================== */
.glass-panel{background:var(--panel);border:1px solid var(--glass-edge);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 1px var(--glass-inner)}
.glass-card{background:var(--card);border:1px solid var(--glass-edge);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 1px var(--glass-inner),0 1px 2px var(--glass-contact)}
.glass-popover{background:var(--popover);border:1px solid var(--popover-edge);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 -1px 0 var(--popover-under),0 24px 60px -18px var(--glass-shade),0 6px 16px -6px var(--glass-lift)}

/* ==========================================================================
   Buttons / badges / fields
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-control);font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background var(--t,120ms) ease,opacity 120ms ease;user-select:none}
.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--foreground) 65%,transparent);outline-offset:0}
.btn[disabled],.btn.is-disabled{opacity:.5;pointer-events:none}
.btn[hidden]{display:none!important}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary-edge);box-shadow:inset 0 1px 0 var(--primary-rim),inset 0 -1px 0 var(--primary-under),inset 0 0 0 1px var(--primary-inner),0 1px 2px var(--glass-contact)}
.btn.secondary{background:var(--secondary);color:var(--secondary-fg);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-control-rim)}
.btn.outline{background:transparent;color:var(--foreground);border-color:var(--border);box-shadow:inset 0 1px 0 var(--glass-control-rim)}

@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-control);font-size:12px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;color:var(--foreground)}
.badge .icon{width:12px;height:12px;color:currentColor}

.badge.secondary{background:var(--secondary);color:var(--secondary-fg);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-control-rim)}
.badge.outline{background:transparent;color:var(--foreground);border-color:var(--border);box-shadow:inset 0 1px 0 var(--glass-control-rim)}
.badge.ghost{background:transparent;color:var(--muted-fg);border-color:transparent}

.badge.small{height:20px;padding:0 6px;font-size:11px}

.field{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:var(--radius-control);background:var(--field);border:1px solid var(--field-edge);box-shadow:inset 0 1px 0 var(--field-rim);font-size:13px;min-width:0}
.field input,.field select{background:transparent;border:0;outline:none;min-width:0;flex:1;font-size:13px;color:var(--foreground)}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer}
.field input::placeholder,.textarea::placeholder{color:var(--muted-fg)}
.field .icon{color:var(--muted-fg)}
.textarea{width:100%;padding:10px 12px;border-radius:8px;background:var(--field);border:1px solid var(--field-edge);box-shadow:inset 0 1px 0 var(--field-rim);font-size:14px;line-height:1.6;resize:vertical;outline:none;min-height:84px}
.textarea:focus{border-color:var(--ring);outline:2px solid color-mix(in srgb,var(--foreground) 65%,transparent);outline-offset:0}
.hint{font-size:11px;color:var(--muted-fg);line-height:1.5}
.error-text{font-size:12px;color:var(--destructive);display:flex;gap:6px;align-items:flex-start}

.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--muted);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 1.5px var(--well-shade),inset 0 -1px 0 var(--well-rim);transition:background 120ms ease;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--knob);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--knob) 90%,transparent),0 1px 2px var(--knob-shade);transition:transform 120ms ease}
.switch[aria-checked="true"]{background:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.switch.warn[aria-checked="true"]{background:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,transparent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.switch[disabled]{opacity:.5;pointer-events:none}

/* ==========================================================================
   App shell
   ========================================================================== */
.app{height:100%;display:flex;flex-direction:column;background:var(--background)}
.sysbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--header-border);background:color-mix(in srgb,var(--background) 82%,transparent);backdrop-filter:blur(20px) saturate(160%);z-index:20;position:relative}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-size:13px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted-fg)}
.sys-mid{flex:1;display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted-fg);font-size:12px}
.sys-right{display:flex;align-items:center;gap:4px}
.sys-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted-fg)}
.sys-btn:hover{background:var(--hover);color:var(--foreground)}
.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--secondary);color:var(--secondary-fg);font-size:11px;font-weight:600;border:1px solid var(--glass-edge)}
.shell{flex:1;display:flex;min-height:0}
.rail{width:208px;flex:none;border-right:1px solid var(--border);background:var(--sidebar);backdrop-filter:blur(26px) saturate(180%);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.rail-item{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:8px;color:var(--muted-fg);text-align:left;width:100%}
.rail-item:hover{background:var(--hover);color:var(--foreground)}
.rail-item.active{background:var(--glass-state);border:1px solid var(--glass-state-edge);box-shadow:inset 0 1px 0 var(--glass-state-rim);color:var(--foreground)}
.rail-item .num{width:18px;font-family:var(--font-mono);font-size:11px;letter-spacing:.4px;color:var(--muted-fg)}
.rail-item.active .num{color:var(--foreground)}
.rail-item .label{font-size:14px;font-weight:400}
.rail-item.active .label{font-weight:500}
.rail-item .icon{width:18px;height:18px}
.rail-gap{flex:1}
.rail-foot{border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.rail-account{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted-fg);font-size:12px}
.rail-account .avatar{width:22px;height:22px;font-size:10px}
.paper{flex:1;min-width:0;overflow-y:auto;overflow-x:clip;position:relative}
.paper-inner{max-width:1180px;margin:0 auto;padding:32px}
.mobile-tabs{display:none}
@media (max-width:767px){
  .sysbar{height:40px;padding:0 12px}
  .brand span{display:none}
  .sys-btn.hide-mobile{display:none}
  .rail{display:none}
  .paper-inner{padding:16px 16px 96px}
  .mobile-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--border);background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(24px) saturate(180%);z-index:40}
  .mobile-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted-fg);font-size:10px;min-height:44px}
  .mobile-tab .icon{width:18px;height:18px}
  .mobile-tab.active{color:var(--foreground)}
}

/* ==========================================================================

   ========================================================================== */
.page-head{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}

.state-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}

.tab:hover{background:var(--hover);color:var(--foreground)}

/* ==========================================================================

.queue-notice{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--info-tint);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);font-size:12px;color:var(--foreground);margin:8px 0}

   ========================================================================== */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{width:min(520px,100%);max-height:min(86vh,760px);overflow:auto;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.dialog .desc{font-size:12px;line-height:1.6;color:var(--muted-fg)}
.dialog .body{display:flex;flex-direction:column;gap:12px}
.dialog .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:4px}
.dialog .actions .left{margin-right:auto}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-row>label{font-size:12px;font-weight:500}
.radio-group{display:flex;flex-direction:column;gap:4px}
.radio{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font-size:12px}
.radio:hover{background:var(--hover)}
.radio input{accent-color:var(--success)}
.radio.selected{background:var(--glass-state);border-color:var(--glass-state-edge)}
.check-list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.check-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;text-align:left;width:100%}
.check-row:hover{background:var(--hover)}
.check-row .id{font-family:var(--font-mono);font-size:11px;color:var(--muted-fg);width:44px;flex:none}
.check-row .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-row .badge{flex:none}
.check-row input{accent-color:var(--success)}
@media (max-width:767px){
  .scrim{align-items:flex-end;padding:0}
  .dialog{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .dialog .actions{position:sticky;bottom:0;background:var(--popover);padding-top:12px}
  .dialog .actions .btn{flex:1;height:44px}
  .dialog .field{height:44px}
  .dialog .check-row{min-height:44px}
  .dialog .radio{min-height:44px}
}

/* ==========================================================================
   Toast / prototype toolbar
   ========================================================================== */
.toast-stack{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(420px,calc(100vw - 40px))}
.toast{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;pointer-events:auto;animation:toastin 160ms ease}
.toast .icon{margin-top:1px}
.toast.success .icon{color:var(--success)}
.toast.error .icon{color:var(--destructive)}
.toast.info .icon{color:var(--info)}
@keyframes toastin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:767px){.toast-stack{left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));max-width:none}}

.proto{position:fixed;left:12px;bottom:12px;z-index:90;display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;font-size:11px;color:var(--muted-fg);max-width:calc(100vw - 24px)}
.proto .tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:5px;background:var(--brand-muted);color:var(--foreground);font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;white-space:nowrap}
.proto button,.proto select{height:26px;border-radius:5px;background:var(--glass-control);border:1px solid var(--glass-control-rim);padding:0 7px;font-size:11px;color:var(--foreground);max-width:150px}
.proto button:hover,.proto select:hover{background:var(--hover)}
.proto .sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.proto .collapsed{display:none}
.proto.is-collapsed .collapsed{display:flex}
.proto.is-collapsed .expanded{display:none}
.proto-expand{position:fixed;left:12px;bottom:12px;z-index:91;height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-family:var(--font-mono);letter-spacing:.06em;display:none}
.proto.is-collapsed + .proto-expand{display:flex;align-items:center;gap:6px}
body.no-chrome .proto,body.no-chrome .proto-expand{display:none!important}
body.no-chrome .paper-inner{padding-bottom:32px}
@media (max-width:767px){
  .proto{bottom:calc(64px + env(safe-area-inset-bottom));overflow:auto;flex-wrap:wrap;max-width:calc(100vw - 24px)}
  .proto .hide-mobile{display:none}
}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width:1279px){
  .rail{width:60px;padding:16px 8px;align-items:center}
  .rail-item{justify-content:center;padding:0;width:40px}
  .rail-item .num,.rail-item .label{display:none}
  .rail-account{padding:6px 0;justify-content:center;width:40px}
  .rail-account .name{display:none}
  .paper-inner{padding:24px}
}
@media (max-width:1179px){
  .task-grid{grid-template-columns:minmax(0,1fr)}
  .task-aside{position:static;order:-1;max-height:none;overflow:visible;padding-right:0}
  .task-card{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px 20px;align-items:start}
  .task-card-head{grid-column:1/-1}
  .task-card .lease-block{grid-row:2/span 2;align-self:stretch;justify-content:center}
  .task-card .facts{grid-column:2;grid-template-columns:60px minmax(0,1fr)}
  .task-card .task-section{grid-column:1/-1}
  .task-card .task-actions{grid-column:1/-1}
  .task-card .sync-copies{grid-column:1/-1}
  .task-card .task-labels-section{grid-column:1/-1}
}
@media (max-width:1023px){
  .sync-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dead-row{grid-template-columns:92px 1fr 100px;grid-auto-rows:auto}
  .dead-row .att{display:none}
  .dead-row .err{grid-column:1/-1;white-space:normal}
}
@media (max-width:767px){
  .title-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
  .title-row h1{grid-column:1;grid-row:1;font-size:20px}
  .title-badges{grid-column:1/-1;grid-row:2}
  .head-actions{grid-column:2;grid-row:1;margin-left:0;flex-wrap:nowrap}
  .head-actions .btn .btn-label{display:none}
  .head-actions .btn{width:44px;height:44px;padding:0}
  .head-actions .btn.primary{width:auto;padding:0 12px}
  .head-actions .btn.primary .btn-label{display:inline}
  .view-tabs{gap:12px;overflow-x:auto;scrollbar-width:none}
  .view-tabs::-webkit-scrollbar{display:none}
  .view-tab{height:44px;font-size:12px}
  .tab{height:34px;padding:0 9px;font-size:12px}
  .tabs-tray{gap:0;padding:2px}
  .chips{gap:2px}
  .chip{height:32px;padding:0 8px;font-size:11px}
  .filter-bar{gap:6px}
  .filter-pill{height:44px;flex:1;min-width:0}
  .filter-pill .value{max-width:none}
  .filter-wrap.desktop-only{display:none}
  .filter-mobile{display:inline-flex!important}
  .sort-note{display:none}
  .column-head{display:none}
  .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"id state deadline" "main main main";gap:4px 8px;padding:12px 6px;align-items:center}
  .row-id{grid-area:id;justify-self:start;text-align:left;font-size:11px;padding-top:0}
  .row-state{grid-area:state;justify-self:start;padding-top:0}
  .row-main{grid-area:main;gap:4px;padding-top:2px}
  .row-title{-webkit-line-clamp:2;font-size:14px}
  .row-meta{gap:5px}
  .row-channel{font-size:10px}
  .row-label{height:16px;font-size:9px}
  .row-deadline{grid-area:deadline;max-width:110px;justify-self:end}
  .deadline-main{font-size:11px;white-space:normal;text-align:right}
  .deadline-sub{font-size:10px;white-space:normal;text-align:right;max-width:110px}
  .queue-meta{font-size:10px}
  .load-more .btn{height:44px}
  .task-title-row h1{font-size:20px;max-width:100%}
  .task-title-row .task-id{padding-top:2px}
  .task-title-actions{width:100%;margin-left:0}
  .task-title-actions .btn{height:44px;flex:1}
  .task-grid{gap:16px}
  .task-card{display:flex;flex-direction:column;gap:12px;padding:14px}
  .task-card .lease-block{padding:10px}
  .task-card .facts{grid-template-columns:64px minmax(0,1fr)}
  .task-facts-toggle{display:inline-flex;margin-left:auto}
  .task-card:not(.show-facts) .fact-secondary{display:none}
  .action-primary .btn{height:44px;font-size:14px}
  .action-secondary .btn{height:44px}
  .action-secondary{grid-template-columns:1fr 1fr}
  .task-actions .btn.ghost{height:44px}
  .msg-body{font-size:14px}
  .reply .msg-body{font-size:13px}
  .composer{position:sticky;bottom:calc(56px + env(safe-area-inset-bottom));z-index:30;margin:16px -16px -96px;border-radius:12px 12px 0 0;background:color-mix(in srgb,var(--background) 92%,transparent);backdrop-filter:blur(24px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}
  .composer textarea{min-height:48px}
  .composer-bar .hint{display:none}
  .composer-error .btn{height:44px}
  .health-line{font-size:11px}
  .sync-card{padding:14px}
  .sync-grid{grid-template-columns:1fr 1fr;gap:10px 12px}
  .sync-actions .btn{height:44px}
  .dead-row{grid-template-columns:minmax(0,1fr) 72px;padding:10px;gap:4px 8px}
  .dead-row .id,.dead-row .err{grid-column:1}
  .dead-row .btn{grid-row:1/span 2;grid-column:2;align-self:center}
  .dead-row .received,.dead-row .att{display:none}
  .auto-block{padding:14px}
  .auto-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .auto-side{justify-content:flex-end}
  .auto-side .btn{height:44px}
  .empty{padding:32px 12px}
  .empty-actions .btn{height:44px}
  .toast{font-size:12px}
}
.filter-mobile{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ==========================================================================
   Toast / actions
   ========================================================================== */
function toast(text, kind = "success") {
  const el = document.createElement("div");
  el.className = `toast glass-popover ${kind}`;
  el.innerHTML = `${icon(kind === "success" ? "check" : kind === "error" ? "alert" : "info", "sm")}<span>${esc(text)}</span>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity 160ms"; setTimeout(() => el.remove(), 180); }, 3600);
}
function closeMenus() { document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open")); }
function closeDialog() { S.dialog = ""; document.getElementById("dialog-root").innerHTML = ""; }
function setScene(scene, view) {
  if (scene === "sync" || scene === "automation") S.scene = scene;
  else if (scene === "task") S.scene = "task";
  else if (scene === "gone") S.scene = "gone";
  else S.scene = "queue";
  S.state = "success";
  closeDialog();
  render();
  document.getElementById("paper").scrollTop = 0;
}
function saveHistory() {
  const p = new URLSearchParams();
  p.set("scene", S.scene);
  if (S.state !== "success") p.set("state", S.state);
  if (S.me !== "manager") p.set("me", S.me);
  if (S.scene === "task") p.set("id", S.id);
  if (S.dialog) p.set("dialog", S.dialog);
  if (S.scene === "sync" && S.sync !== "success") p.set("sync", S.sync);
  if (S.scene === "automation" && S.automation !== "success") p.set("automation", S.automation);
  if (!S.chrome) p.set("chrome", "0");
  if (S.theme !== "dark") p.set("theme", S.theme);
  history.replaceState(null, "", "?" + p.toString());
}
function rerender() { render(); saveHistory(); }

function confirmAction(kind) {
  const t = taskById(S.id) || TASKS[0];
  if (kind === "complete") {
    const result = (document.getElementById("d-result")?.value || "").trim();
    t.state = "completed"; t.result = result || "已完成。"; t.claim = null; t.updated = "刚刚";
    const dependents = TASKS.filter((x) => (x.needs || []).includes(t.id));
    let readied = 0;
    dependents.forEach((dep) => {
      if (dep.state === "waiting" && dep.needs.every((id) => effective(taskById(id) || {}) === "completed")) { dep.state = "ready"; readied += 1; }
    });
    closeDialog(); toast(`已完成 #${t.id} · ${readied} 个依赖任务已就绪`); rerender();
  } else if (kind === "fail") {
    const reason = (document.getElementById("d-reason")?.value || "").trim();
    if (!reason) { toast("请填写失败原因", "error"); return; }
    t.state = "failed"; t.reason = reason; t.claim = null; t.updated = "刚刚";
    closeDialog(); toast(`已标记 #${t.id} 失败`); rerender();
  } else if (kind === "block") {
    const kindValue = document.querySelector('input[name="d-kind"]:checked')?.value || "needs_input";
    const reason = (document.getElementById("d-block-reason")?.value || "").trim();
    if (!reason) { toast("请填写阻塞说明", "error"); return; }
    t.state = "blocked"; t.blocked = { kind: kindValue, reason }; t.claim = null; t.updated = "刚刚";
    closeDialog(); toast(`已阻塞 #${t.id} · ${BLOCK_LABEL[kindValue]}`); rerender();
  } else if (kind === "assign") {
    const value = document.getElementById("d-assign")?.value || "池中（任何有编辑权限的人）";
    t.for = value.startsWith("池中") ? "池中" : value.replace("（账号）", "（账号）");
    closeDialog(); toast(`已把 #${t.id} 指派给 ${t.for}`); rerender();
  } else if (kind === "needs") {
    const ids = Array.from(document.querySelectorAll('input[name="d-needs"]:checked')).map((x) => x.value);
    if (ids.length > 20) { toast("最多 20 个前置", "error"); return; }
    t.needs = ids;
    if (effective(t) === "blocked") {
      t.state = "blocked";
    } else if (["waiting", "ready"].includes(effective(t))) {
      const done = ids.length === 0 || ids.every((id) => effective(taskById(id) || {}) === "completed");
      t.state = done ? "ready" : "waiting";
    }
    closeDialog(); toast(`已保存 #${t.id} 的前置依赖`); rerender();
  } else if (kind === "cancel") {
    const reason = (document.getElementById("d-cancel")?.value || "").trim();
    if (!reason) { toast("请填写取消原因", "error"); return; }
    t.state = "canceled"; t.reason = reason; t.claim = null; t.updated = "刚刚";
    closeDialog(); toast(`已取消 #${t.id}`); rerender();
  } else if (kind === "release") {
    t.state = "ready"; t.claim = null; t.updated = "刚刚";
    closeDialog(); toast(`已释放 #${t.id}`); rerender();
  } else if (kind === "reopen") {
    t.state = "ready"; t.updated = "刚刚";
    closeDialog(); toast(`已重新打开 #${t.id}`); rerender();
  } else if (kind === "unblock") {
    const note = (document.getElementById("d-note")?.value || "").trim();
    if (note) { (REPLIES[t.id] = REPLIES[t.id] || []).push({ id: "m" + Date.now(), author: "陈墨", time: "刚刚", text: note }); }
    const done = !(t.needs || []).length || (t.needs || []).every((id) => effective(taskById(id) || {}) === "completed");
    t.state = done ? "ready" : "waiting"; t.blocked = null; t.updated = "刚刚";
    closeDialog(); toast(done ? `已解除阻塞 #${t.id} · 回到可认领` : `已解除阻塞 #${t.id} · 仍在等待前置`); rerender();
  } else if (kind === "answer") {
    const answer = (document.getElementById("d-answer")?.value || "").trim();
    if (!answer) { toast("请填写回答", "error"); return; }
    (REPLIES[t.id] = REPLIES[t.id] || []).push({ id: "m" + Date.now(), author: "陈墨", time: "刚刚", text: answer });
    t.state = "ready"; t.blocked = null; t.updated = "刚刚";
    closeDialog(); toast(`已回答并解除 #${t.id}`); rerender();
  } else if (kind === "new") {
    const text = (document.getElementById("d-text")?.value || "").trim();
    if (!text) { toast("请填写任务说明", "error"); return; }
    const id = String(900 + TASKS.length);
    const channel = document.getElementById("d-channel")?.value || "work";
    const labels = parseLabels(document.getElementById("d-label")?.value || "");
    TASKS.push({ id, title: text.split("\n")[0].slice(0, 80), state: "ready", channel, owner: me().name, by: me().actor, for: "池中", labels, needs: [], created: "刚刚", updated: "刚刚", body: text });
    closeDialog(); S.scene = "task"; S.id = id; toast(`已创建任务 #${id}`); rerender();
  } else if (kind === "filters") {
    S.filters.channel = document.getElementById("f-channel")?.value || "all";
    S.filters.label = document.getElementById("f-label")?.value || "all";
    S.filters.owner = document.getElementById("f-owner")?.value || "all";
    S.filters.for = document.getElementById("f-for")?.value || "all";
    closeDialog(); S.page = 0; rerender();
  } else if (kind === "cancel-schedule") {
    const s = SCHEDULES.find((x) => x.id === "渠道 B 对账提醒");
    if (s) s.status = "canceled", s.cadence = "已取消", s.error = "";
    closeDialog(); toast("已取消定时任务"); rerender();
  } else if (kind === "disable-sync") {
    const e = SYNC.find((x) => x.key === S.syncKey);
    if (e) { e.enabled = false; e.status = "paused"; }
    closeDialog(); toast("已停用同步入口 · 已同步的副本保留"); rerender();
  }
}
function parseLabels(text) {
  const out = {};
  text.split(/\s+/).filter(Boolean).forEach((part) => {
    const [k, v] = part.split("=");
    if (k && v && !k.startsWith("board.")) out[k] = v;
  });
  return out;
}

/* ==========================================================================
   Events
   ========================================================================== */
document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-action]");
  if (!el) { closeMenus(); return; }
  const action = el.dataset.action;
  if (action === "menu") {
    event.stopPropagation();
    const menu = el.parentElement.querySelector(".menu");
    const open = menu.classList.contains("open");
    closeMenus();
    if (!open) menu.classList.add("open");
    return;
  }
  if (action === "filter") {
    const key = el.dataset.key;
    S.filters[key] = el.dataset.value;
    S.page = 0; S.state = "success";
    closeMenus(); rerender(); return;
  }
  if (action === "tab") {
    S.tab = el.dataset.tab; S.sub = "all"; S.page = 0; S.state = "success"; S.selected = 0; rerender(); return;
  }
  if (action === "sub") {
    S.sub = el.dataset.sub; S.page = 0; S.state = "success"; S.selected = 0; rerender(); return;
  }
  if (action === "view") {
    const v = el.dataset.view;
    if (v === "queue") setScene("queue");
    else if (v === "sync") setScene("sync");
    else if (v === "automation") setScene("automation");
    return;
  }
  if (action === "nav") {
    const scene = el.dataset.scene;
    if (scene === "workspace" || scene === "bots" || scene === "teams" || scene === "settings") {
      toast(scene === "workspace" ? "工作区不在本切片；原型只覆盖任务面。" : "这个章节不在本切片。", "info");
      return;
    }
    setScene(scene);
    return;
  }
  if (action === "open-task") {
    S.scene = "task"; S.id = el.dataset.id; S.state = "success"; S.dialog = ""; S.claimLost = false; S.page = 0; S.replyMore = false;
    rerender(); document.getElementById("paper").scrollTop = 0; return;
  }
  if (action === "claim") {
    const t = taskById(el.dataset.id || S.id);
    t.state = "claimed"; t.claim = { actor: me().actor, mine: true, until: Date.now() + 900000, lease: 900 }; t.updated = "刚刚";
    toast(`已认领 #${t.id} · 租约至 ${new Date(t.claim.until).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`); rerender(); return;
  }
  if (action === "claim-options") { toast("认领时长：30 秒 / 15 分钟 / 60 分钟（原型）", "info"); return; }
  if (action === "renew") {
    const t = taskById(S.id);
    if (t.claim) { t.claim.until = Date.now() + 900000; t.claim.lease = 900; toast("租约已延长 15 分钟"); rerender(); }
    return;
  }
  if (action === "toggle-facts") {
    const card = document.querySelector(".task-card");
    if (card) {
      card.classList.toggle("show-facts");
      S.showFacts = card.classList.contains("show-facts");
      el.textContent = S.showFacts ? "收起" : "详情";
    }
    return;
  }
  if (action === "copy-link") {
    const url = location.href.split("?")[0] + `?scene=task&id=${S.id}`;
    copyText(url); toast("任务链接已复制"); return;
  }
  if (action === "copy-request" || action === "copy-explain") {
    copyText(action === "copy-request" ? `我需要「查看任务」能力（board.read），请把我的账号「${me().name}」加入有该能力的权限组。` : "旧「超级助理工单看板」已下线；任务与回复现在在任务看板 /board。"); toast("已复制"); return;
  }
  if (action === "copy-draft") { copyText(S.draft); toast("草稿已复制"); return; }
  if (action === "refresh" || action === "retry") {
    S.state = "success"; rerender(); toast("已刷新", "info"); return;
  }
  if (action === "load-more") { S.page = 1; rerender(); return; }
  if (action === "load-earlier") { S.replyMore = true; toast("已加载更早的回复", "info"); rerender(); return; }
  if (action === "reply") {
    S.scene = "task"; document.getElementById("composer-input")?.focus(); return;
  }
  if (action === "focus-composer") {
    document.getElementById("composer-input")?.focus(); return;
  }
  if (action === "send-reply") {
    sendReply(); return;
  }
  if (action === "send-retry") {
    S.sendFailed = false; S.composerError = false; sendReply(); return;
  }
  if (action === "dialog") {
    S.dialog = el.dataset.dialog; render(); return;
  }
  if (action === "dialog-close") { closeDialog(); return; }
  if (action === "scrim" && event.target === el) { closeDialog(); return; }
  if (action === "confirm") { confirmAction(el.dataset.kind); return; }
  if (action === "theme") {
    S.theme = S.theme === "dark" ? "light" : "dark"; rerender(); return;
  }
  if (action === "clear-filters") {
    S.filters = { channel: "all", label: "all", owner: "all", for: "all" }; S.page = 0; S.state = "success"; closeDialog(); rerender(); return;
  }
  if (action === "toggle-sync") {
    const e = SYNC.find((x) => x.key === el.dataset.key);
    if (e.enabled) {
      S.dialog = "confirm-disable-sync"; S.syncKey = e.key; render(); return;
    }
    e.enabled = true; e.status = "active"; toast(`已启用 ${e.key}`); rerender(); return;
  }
  if (action === "confirm-disable-sync") {
    const e = SYNC.find((x) => x.key === S.syncKey);
    if (e) { e.enabled = false; e.status = "paused"; }
    closeDialog(); toast("已停用同步入口 · 已同步的副本保留"); rerender(); return;
  }
  if (action === "retry-dead") { toast("已重新排队死信 · 只影响该外部线程"); return; }
  if (action === "retry-one") { toast("已重新排队 · 等待下次投递"); return; }
  if (action === "toggle-watcher") {
    const w = WATCHERS.find((x) => x.id === el.dataset.id);
    w.enabled = !w.enabled;
    toast(w.enabled ? `已启用 ${w.id}` : `已停用 ${w.id} · 5 秒内可撤销`, w.enabled ? "success" : "info");
    rerender(); return;
  }
  if (action === "toggle-schedule") {
    const s = SCHEDULES.find((x) => x.id === el.dataset.id);
    if (s.status === "failed") { toast("创建者已失去频道权限，不能继续；只能取消", "error"); return; }
    if (s.status === "paused") { s.status = "pending"; s.cadence = s.cadence.replace("已暂停", "下次 11-28 09:00"); toast("已继续定时任务"); }
    else { s.status = "paused"; s.cadence = s.cadence.replace(/下次 [0-9-]+ [0-9:]+/, "已暂停"); toast("已暂停定时任务 · 可随时继续", "info"); }
    rerender(); return;
  }
  if (action === "dialog" && el.dataset.dialog === "filters") {
    return;
  }
  if (action === "proto-reset") { location.href = location.pathname; return; }
  if (action === "proto-hide") { S.chrome = false; rerender(); return; }
  if (action === "proto-expand") {
    document.getElementById("proto").classList.toggle("is-collapsed"); return;
  }
});

function sendReply() {
  const t = taskById(S.id);
  const input = document.getElementById("composer-input");
  if (input) S.draft = input.value;
  if (!S.draft.trim()) return;
  if (S.composerError) {
    S.sendFailed = true; S.composerError = false; rerender(); return;
  }
  S.sending = true;
  document.querySelector('[data-action="send-reply"]')?.classList.add("is-disabled");
  const btn = document.querySelector('[data-action="send-reply"]');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>发送中…`; }
  setTimeout(() => {
    (REPLIES[t.id] = REPLIES[t.id] || []).push({ id: "m" + Date.now(), author: me().name, time: "刚刚", text: S.draft });
    S.draft = ""; S.sending = false; S.sendFailed = false;
    rerender();
    document.getElementById("paper").scrollTop = document.getElementById("paper").scrollHeight;
    toast("回复已发送");
  }, 420);
}

document.addEventListener("input", (event) => {
  if (event.target.id === "composer-input") {
    S.draft = event.target.value;
    const btn = document.querySelector('[data-action="send-reply"]');
    if (btn) btn.disabled = !S.draft.trim();
    const count = document.querySelector(".composer-bar .count");
    if (count) count.textContent = S.draft.length > 9000 ? `${S.draft.length} / 10,000` : "";
    if (count) count.classList.toggle("over", S.draft.length > 10000);
  }
  if (event.target.id === "d-answer") {
    const c = document.getElementById("answer-count"); if (c) c.textContent = event.target.value.length;
  }
  if (event.target.name === "d-kind") {
    document.querySelectorAll(".radio").forEach((r) => r.classList.toggle("selected", r.querySelector("input")?.checked));
  }
});

document.addEventListener("change", (event) => {
  if (event.target.id === "p-scene") { S.scene = event.target.value; S.state = "success"; S.dialog = ""; rerender(); }
  if (event.target.id === "p-state") { S.state = event.target.value; rerender(); }
  if (event.target.id === "p-me") { S.me = event.target.value; rerender(); }
  if (event.target.id === "p-id") { S.scene = "task"; S.id = event.target.value; S.state = "success"; rerender(); }
  if (event.target.id === "p-dialog") { S.dialog = event.target.value; render(); }
});

document.addEventListener("keydown", (event) => {
  const tag = (event.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (event.key === "Escape") {
    if (S.dialog) { closeDialog(); return; }
    if (S.scene === "task") { setScene("queue"); return; }
    closeMenus(); return;
  }
  if (S.dialog) return;
  if (typing) {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") { event.preventDefault(); sendReply(); }
    return;
  }
  if (event.key === "?") { S.dialog = "shortcuts"; render(); return; }
  if (S.scene === "queue") {
    const rows = visibleTasks();
    if (event.key === "j" || event.key === "ArrowDown") { event.preventDefault(); S.selected = Math.min(rows.length - 1, S.selected + 1); rerender(); return; }
    if (event.key === "k" || event.key === "ArrowUp") { event.preventDefault(); S.selected = Math.max(0, S.selected - 1); rerender(); return; }
    if (event.key === "Enter" && rows[S.selected]) { S.scene = "task"; S.id = rows[S.selected].id; S.state = "success"; rerender(); return; }
    if (event.key === "[") { S.tab = "open"; S.sub = "all"; rerender(); return; }
    if (event.key === "]") { S.tab = "completed"; rerender(); return; }
    if (event.key === "/") { event.preventDefault(); S.dialog = "filters"; render(); return; }
    if (event.key === "c" && rows[S.selected]) {
      const t = rows[S.selected];
      if (canClaim(t)) { t.state = "claimed"; t.claim = { actor: me().actor, mine: true, until: Date.now() + 900000, lease: 900 }; toast(`已认领 #${t.id}`); rerender(); }
      else toast("这个任务当前不能认领", "error");
      return;
    }
  }
  if (S.scene === "task") {
    const t = taskById(S.id);
    const map = { e: "complete", f: "fail", b: "block", a: "assign", n: "needs", x: "cancel", o: "reopen", u: "unblock" };
    if (event.key === "r") { const b = document.querySelector('[data-action="renew"]'); if (b) b.click(); return; }
    if (map[event.key]) { S.dialog = map[event.key]; render(); return; }
    if (event.key === "c" && effective(t) === "ready") { document.querySelector('[data-action="claim"]')?.click(); return; }
  }
});

/* ==========================================================================
   Boot
   ========================================================================== */
function boot() {
  const p = new URLSearchParams(location.search);
  S.scene = ["queue", "task", "sync", "automation", "gone"].includes(p.get("scene")) ? p.get("scene") : "queue";
  S.state = p.get("state") || "success";
  S.me = ["manager", "reader", "none"].includes(p.get("me")) ? p.get("me") : "manager";
  S.id = p.get("id") || "812";
  S.dialog = p.get("dialog") || "";
  S.sync = p.get("sync") || "success";
  S.automation = p.get("automation") || "success";
  if (S.sync === "loading" || S.sync === "error") S.state = S.sync;
  if (S.automation === "loading" || S.automation === "error") S.state = S.automation;
  if (p.get("bridge") === "0") { const m = TASKS.find((x) => x.id === "814"); if (m) m.bridge = false; }
  S.chrome = p.get("chrome") !== "0";
  S.theme = p.get("theme") === "light" ? "light" : "dark";
  S.tab = p.get("tab") || "open";
  S.sub = p.get("sub") || "all";
  if (p.get("claim") === "lost") S.claimLost = true;
  if (p.get("composer") === "error") { S.composerError = true; S.sendFailed = true; S.draft = "已确认灰度 5%，30 分钟无重复。"; }
  if (p.get("channel")) S.filters.channel = p.get("channel");
  if (p.get("label")) S.filters.label = p.get("label");
  if (p.get("owner")) S.filters.owner = p.get("owner");
  if (p.get("for")) S.filters.for = p.get("for");
  if (S.state === "filtered") {
    S.filters = { channel: "work/release", label: "priority=urgent", owner: "林岚", for: "all" };
    S.tab = "open";
  }
  document.getElementById("proto").classList.toggle("is-collapsed", window.innerWidth <= 767);
  if (S.state === "permission") S.me = "none";
  if (p.get("facts") === "1") S.showFacts = true;
  render();
  saveHistory();
  const scrollTo = p.get("scroll");
  if (scrollTo) {
    setTimeout(() => {
      const map = { thread: "root-message", composer: "composer-input", dead: "dead-section", linear: "sync-linear", github: "sync-github", schedules: "schedules-section", watchers: "watchers-section" };
      const el = document.getElementById(map[scrollTo] || scrollTo);
      if (el) el.scrollIntoView({ block: scrollTo === "linear" ? "center" : "start" });
    }, 120);
  }
}
let tickHandle = null;
function startTick() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(() => {
    let changed = false;
    document.querySelectorAll("[data-countdown]").forEach((el) => {
      const id = el.dataset.countdown;
      const t = taskById(id);
      if (!t || !t.claim) return;
      const left = t.claim.until - Date.now();
      if (left <= 0) {
        el.textContent = "00:00";
        if (t.state === "claimed" && !t.claim.expired) { changed = true; }
      } else {
        el.textContent = countdown(left);
        const fill = document.querySelector(`[data-lease-fill="${id}"]`);
        if (fill) {
          const pct = Math.max(2, Math.min(100, Math.round((left / ((t.claim.lease || 900) * 1000)) * 100)));
          fill.style.width = pct + "%";
          fill.classList.toggle("warn", left < 60000);
          fill.classList.toggle("danger", left < 10000);
        }
      }
    });
    if (changed) render();
  }, 1000);
}
function copyText(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  else {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
}
boot();
</script>
